name: LyricsSync
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""

targets:
  LyricsSync:
    type: application
    platform: iOS
    sources:
      - path: LyricsSync
      - path: Shared
    info:
      path: LyricsSync/Info.plist
      properties:
        CFBundleDisplayName: LyricsSync
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - lyricssync
    entitlements:
      path: LyricsSync/LyricsSync.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.trevorohlson0708.lyricssync
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trevorohlson0708.lyricssync
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: LyricsSyncWidgetExtension
        embed: true

  LyricsSyncWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: LyricsSyncWidget
      - path: Shared
    info:
      path: LyricsSyncWidget/Info.plist
      properties:
        CFBundleDisplayName: LyricsSync Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: LyricsSyncWidget/LyricsSyncWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.trevorohlson0708.lyricssync
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trevorohlson0708.lyricssync.widget
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO

schemes:
  LyricsSync:
    build:
      targets:
        LyricsSync: all
    archive:
      config: Release
